name: Installers

# Freezes both programs on every desktop and runs the acceptance checks. This is
# the honest answer to "does it build on Windows?" — and until it passes, the
# README must not claim cross-platform support.
on:
  workflow_dispatch:
  push:
    tags: ["v*"]
  pull_request:
    paths:
      - ".github/workflows/installers.yml"
      - "packaging/**"
      - "pyproject.toml"
      - "uv.lock"

permissions:
  contents: read

jobs:
  freeze:
    name: freeze (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-22.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          python-version: "3.12"

      - name: Runtime libraries (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libportaudio2 libxkbcommon0

      - name: Install
        run: uv sync --extra voice --extra sidecar --group build

      # The acceptance test speaks a real phrase, so it needs a real voice. The
      # smallest one is enough: this checks that espeak-ng can phonemize, not
      # that the audio is pretty.
      - name: Small voice for the acceptance test
        shell: bash
        run: |
          uv run python -m piper.download_voices en_US-lessac-low \
            --download-dir "$RUNNER_TEMP/voices"

      - name: Freeze and accept
        shell: bash
        run: |
          uv run python packaging/build.py \
            --version "0.0.0-${GITHUB_SHA::7}" \
            --out dist \
            --accept-model "$RUNNER_TEMP/voices/en_US-lessac-low.onnx"

      - name: Sizes
        shell: bash
        run: |
          du -sh dist/* 2>/dev/null | sort -h || true

      - name: Keep the artefacts
        uses: actions/upload-artifact@v4
        with:
          name: almathus-${{ matrix.os }}
          path: |
            dist/*.dmg
            dist/*.zip
            dist/*.tar.gz
            dist/SHA256SUMS
          if-no-files-found: error
          retention-days: 14

  gpl-source:
    name: gpl source
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"

      - name: Install
        run: uv sync --extra sidecar --group build

      # The offer printed inside every bundle points at this file, so it has to
      # exist for any tag that ships a binary.
      - name: Build the corresponding source
        run: |
          version="${GITHUB_REF_NAME#v}"
          if [ -z "$version" ] || [ "$version" = "$GITHUB_REF_NAME" ]; then
            version="0.0.0-${GITHUB_SHA::7}"
          fi
          ./packaging/gpl-source.sh "$version" dist

      - uses: actions/upload-artifact@v4
        with:
          name: almathus-gpl-source
          path: dist/almathus-voice-*.tar.gz
          if-no-files-found: error
          retention-days: 14

  publish:
    name: publish draft
    # Nothing reaches users without a person clicking "publish release".
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [freeze, gpl-source]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: arts

      - name: One checksum list
        run: |
          find arts -name SHA256SUMS -exec cat {} + | sort -k2 > arts/SHA256SUMS
          cat arts/SHA256SUMS

      - uses: softprops/action-gh-release@v2
        with:
          draft: true
          generate_release_notes: true
          files: |
            arts/**/*.dmg
            arts/**/*.zip
            arts/**/*.tar.gz
            arts/**/*.exe
            arts/**/*.AppImage
            arts/SHA256SUMS
