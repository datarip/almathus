[project]
name = "almathus"
version = "0.1.0"
description = "A kid-friendly mental-math game (Tkinter)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
# Voice answering (STT). TTS uses macOS `say` and needs nothing installed.
# vosk: number-only grammar, the primary recognizer where a model exists.
#   Needs a model in ./models — see README (download vosk-model-small-fr-0.22).
# parakeet-mlx targets Apple Silicon; on other platforms set ALMATHUS_PARAKEET_CMD.
#   It is the recognizer for languages with no Vosk model (English out of the box).
# Spoken numbers are parsed by voice.strict_numbers — no library, on purpose: the
#   rule has to be "numbers and nothing else", which a general parser will not do.
voice = ["sounddevice", "numpy", "parakeet-mlx", "vosk", "webrtcvad-wheels"]

[project.scripts]
almathus = "main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
include = ["main.py"]
