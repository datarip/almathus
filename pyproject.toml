[project]
name = "almathus"
dynamic = ["version"]
description = "A kid-friendly mental-math game (Tkinter)"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "Datarip" }]
# The sidecar/ tree is a separate GPL-3.0 program and is not part of the wheel;
# keeps the GPL engine out of the MIT app; see NOTICE and README.md > Licensing.
dependencies = []

[project.optional-dependencies]
# Voice answering (STT) and playback. The spoken voice is not here: it runs in
# a separate GPL program (see the sidecar extra) so the game itself never links
# Piper or espeak-ng.
# vosk: the one recognizer, one small model per language, downloaded on first
#   run by the setup screen (see languages.py).
# num2words generates 0..100 number words for the installed language, from which
#   voice derives the Vosk grammar and the parser tables. fr/en stay hand-tuned.
# Spoken numbers are parsed by voice.strict_numbers — no library, on purpose: the
#   rule has to be "numbers and nothing else", which a general parser will not do.
voice = [
    "sounddevice",
    "numpy",
    "scipy",  # Butterworth band-pass for the VAD/voicing test (has a fallback)
    "num2words",
    # vosk 0.3.45 ships no macOS wheel (0.3.44 is the last universal2 build), so
    # resolving to it silently drops the primary French recognizer on a Mac.
    "vosk<0.3.45; sys_platform == 'darwin'",
    "vosk; sys_platform != 'darwin'",
    "webrtcvad-wheels",
]

# The Piper sidecar — a separate program, GPL-3.0, run out-of-process. The game
# talks to it over stdin/stdout and never imports it. Packaged apps ship a
# frozen `piper-sidecar` instead; this extra is for a repository checkout. The
# PyPI sdist excludes sidecar/, so it carries the engine but not the script.
sidecar = [
    # [ja]: Piper's Japanese voice needs OpenJTalk to phonemize; the wheel is
    # ~26 MB and the only language with an extra, so it rides with the engine.
    "piper-tts[ja]",
]

[project.urls]
Homepage = "https://github.com/datarip/almathus"
Issues = "https://github.com/datarip/almathus/issues"
Releases = "https://github.com/datarip/almathus/releases"

[project.scripts]
almathus = "main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
# One source of truth: `version.py`, which packaging/build.py stamps from the tag.
path = "version.py"

[tool.hatch.build.targets.sdist]
# The sidecar is a separate GPL-3.0 program, not part of the game package. Keep
# it out of the PyPI source archive so both distribution artefacts are MIT;
# the sidecar travels with the repository or as a frozen helper. See NOTICE.
exclude = ["/sidecar"]

[tool.hatch.build.targets.wheel]
# A flat layout: the runtime modules sit beside one another, and everything the
# game reads at run time (title art, flags, sounds) lives under assets/. Tests,
# tools/, mic_check.py and sidecar/ are not part of the app package: the
# sidecar is a separate GPL program, not a module of the game.
include = [
    "main.py",
    "version.py",
    "i18n.py",
    "languages.py",
    "voice.py",
    "voices.py",
    "results.py",
    "pdfreport.py",
    "sfx.py",
    "assets",
]
exclude = ["**/.DS_Store", "**/__pycache__"]

[dependency-groups]
# Quality gate. Both must be clean before a commit.
dev = ["mypy", "ruff"]

# --------------------------------------------------------------------------- #
# Linting / formatting
# --------------------------------------------------------------------------- #
[tool.ruff]
target-version = "py312"
extend-exclude = ["models", "results", "stats"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # import sorting
    "UP",   # pyupgrade
    "B",    # bugbear
    "SIM",  # simplify
    "C4",   # comprehensions
    "DTZ",  # naive datetimes
    "RUF",  # ruff-specific
    "BLE",  # blind except
    "PIE",  # misc lint
    "RET",  # return style
    "ARG",  # unused arguments
    "PTH",  # prefer pathlib
    "TRY",  # exception antipatterns
    "ISC",  # implicit str concat
    "N",    # pep8 naming
    "PLC",
    "PLE",
    "PLW",
    "PLR",
    "S",    # bandit
]
ignore = [
    # The formatter owns line length; it cannot split long strings or comments
    # and we would rather keep those readable than knife them at column 88.
    "E501",
    # This is a game: `if score == 3` reads better than a named constant, and
    # the function-size rules would flag Tkinter screen builders forever.
    "PLR2004", "PLR0911", "PLR0912", "PLR0913", "PLR0915", "PLR0917",
    # Tests assert.
    "S101",
    # The app is French: accented letters, typographic quotes and em dashes are
    # the content, not a homoglyph attack.
    "RUF001", "RUF002", "RUF003",
    # Optional voice/audio deps are imported inside functions on purpose, so the
    # game still starts when they are missing.
    "PLC0415",
]

[tool.ruff.lint.per-file-ignores]
# Tkinter binds callbacks as `lambda e: ...`; the event is part of the contract.
"main.py" = ["ARG005"]
# voice.py wraps three optional native stacks — PortAudio, WebRTC VAD and Vosk
# — each of which raises whatever its C layer feels like. Catching Exception
# and falling back to the keypad *is* this module's contract — the game stays
# fully playable if the voice deps or models are absent — so the rule is off
# here rather than waived 25 times. Every such handler logs through
# _dbg(); a silent one is still a bug, and S110/S112 still catch those.
"voice.py" = ["BLE001"]

[tool.ruff.lint.pep8-naming]
# T() is the translation shorthand, used once per user-visible string.
extend-ignore-names = ["T"]

# --------------------------------------------------------------------------- #
# Type checking
# --------------------------------------------------------------------------- #
[tool.mypy]
python_version = "3.12"
files = ["."]
exclude = "^(\\.venv|models|results|stats|assets|build|dist)/"
check_untyped_defs = true
no_implicit_optional = true
strict_equality = true
extra_checks = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_unused_configs = true

# Optional voice extras ship no type stubs.
[[tool.mypy.overrides]]
module = [
    "sounddevice",
    "numpy",
    "num2words",
    "vosk",
    "webrtcvad",
    "pyttsx3",
    "scipy.*",
]
ignore_missing_imports = true
