[project]
name = "almathus"
version = "0.1.0"
description = "A kid-friendly mental-math game (Tkinter)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
# Voice answering (STT). TTS uses macOS `say` and needs nothing installed.
# text2num: robust multilingual spoken-number parsing (FR/EN/ES/PT/DE...).
# parakeet-mlx targets Apple Silicon; on other platforms set ALMATHUS_PARAKEET_CMD.
# vosk: number-only grammar fallback that rescues words parakeet mis-hears (e.g. "un").
#   Needs a model in ./models — see README (download vosk-model-small-fr-0.22).
voice = ["sounddevice", "numpy", "text2num", "parakeet-mlx", "vosk", "webrtcvad-wheels"]

[project.scripts]
almathus = "main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
include = ["main.py"]
